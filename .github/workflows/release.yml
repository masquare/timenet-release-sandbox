name: Release

# Releases masquare-timenet, masquare-timenet-connectors, or both, each with its own version and tag
# <package>-vX.Y.Z. The steps with logic are in .github/scripts/release.py.
#   1. Run this workflow on main and pick the package. It opens a release PR that sets the versions.
#      Its body holds the notes, between release-notes markers. Edit them there: the release uses
#      the text it finds in the merged PR.
#   2. Merge the release PR. The same workflow then builds and smoke-tests the files, tags and
#      creates the GitHub releases, opens a PR for the next development version (merge it any
#      time), and waits for approval in the pypi environment to upload to TestPyPI, and again to
#      upload to PyPI. The uploads publish the built files and do not build.
# Releasing both raises the masquare-timenet floor of masquare-timenet-connectors. A single-package release warns
# when the other package has changes it leaves out. The version is fixed when the release PR opens.
# If main needs a bigger bump before you merge it, close the PR and run the workflow again.
# Only admins and maintainers can start a release, merge the release PR, or re-run a job. Every job
# can be re-run: steps that already happened are skipped.
#
# Needs a GitHub App with contents and pull-requests write access, installed on this repository,
# with its id in the RELEASE_APP_ID variable and its key in the RELEASE_APP_PRIVATE_KEY secret.
# PRs opened with GITHUB_TOKEN are blocked by the repository settings and would not run CI.
# The development version PR merges itself once it has the approvals main requires, when the
# repository allows auto-merge.

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to release
        required: true
        default: both
        type: choice
        options:
          - both
          - masquare-timenet
          - masquare-timenet-connectors
      version:
        description: Version to release, for example 0.12.0. Leave empty to compute it from the commits.
        required: false
        type: string
  push:
    branches: [main]

permissions:
  contents: read

env:
  GIT_CLIFF: git-cliff==2.14.2

jobs:
  authorize:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(release):'))
    runs-on: ubuntu-latest
    steps:
      - name: Allow only admins and maintainers
        env:
          GH_TOKEN: ${{ github.token }}
          # The user who started the run, pushed the merged release PR, or re-ran a job.
          ACTOR: ${{ github.triggering_actor }}
        run: |
          role=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .role_name)
          if [ "$role" != admin ] && [ "$role" != maintain ]; then
            echo "::error title=Not allowed::$ACTOR has the $role role. Only admins and maintainers can release."
            exit 1
          fi

  prepare:
    needs: authorize
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Guard to main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error title=Invalid branch::Start a release from main."
          exit 1
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Set the versions, write the notes and open the release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PACKAGE: ${{ inputs.package }}
          REQUESTED: ${{ inputs.version }}
        run: uv run .github/scripts/release.py prepare --package "$PACKAGE" --version "$REQUESTED"

  release:
    needs: authorize
    if: >-
      github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      released: ${{ steps.released.outputs.released }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Find the packages this PR released
        id: released
        run: uv run .github/scripts/release.py released
      - name: Build
        # build_dists.py records the commit inside each package, so a build can name its code.
        env:
          RELEASED: ${{ steps.released.outputs.released }}
        run: |
          for entry in $RELEASED; do
            uv run scripts/build_dists.py --package "${entry%=*}"
          done
      - name: Smoke test built artifacts
        # Import each artifact in an isolated environment, and check it records this commit.
        run: |
          if curl -sfo /dev/null https://test.pypi.org/simple/masquare-timenet/; then export UV_FIND_LINKS=https://test.pypi.org/simple/masquare-timenet/; fi
          uv run .github/scripts/release.py smoke
      - name: Keep the built files for the publish jobs
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
      - name: Tag and create the GitHub releases
        # Reads the notes from the merged release PR and attaches the files built above.
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASED: ${{ steps.released.outputs.released }}
        run: uv run .github/scripts/release.py github-release --released "$RELEASED"

  publish-testpypi:
    # Waits for approval in the pypi environment. Uploads the files the release job built, nothing is built here.
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      # The OIDC token uv exchanges for a trusted-publishing token. No API tokens are stored.
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v8.2.0
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI
        # --check-url skips files the index already has, so a re-run after a partial upload resumes.
        run: uv publish --publish-url https://test.pypi.org/legacy/ --check-url https://test.pypi.org/simple/ dist/*

  publish-pypi:
    # Starts only after TestPyPI took the same files, and waits for approval in the pypi environment too.
    needs: [release, publish-testpypi]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v8.2.0
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        # --check-url skips files the index already has, so a re-run after a partial upload resumes.
        run: echo "sandbox PyPI upload skipped"

  next-development-version:
    # Runs right after the release, next to the publish jobs. The tag fixes the released version
    # whether or not PyPI takes it. It is its own job, so the App key never shares a runner with the
    # OIDC token that uploads to PyPI.
    needs: release
    runs-on: ubuntu-latest
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Open the development version PR
        # Only a package that main still holds at the released version moves on. So a re-run after
        # the PR was merged changes nothing.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASED: ${{ needs.release.outputs.released }}
        run: uv run .github/scripts/release.py next-dev --released "$RELEASED"
