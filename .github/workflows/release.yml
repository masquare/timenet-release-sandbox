name: Release

# Releases masquare-timenet, masquare-timenet-connectors, or both. Each package has its own version and its own tag,
# <package>-vX.Y.Z. The masquare-timenet notes list the commits that touched packages/timenet. The
# masquare-timenet-connectors notes list the connectors added, changed or removed, and the changes to the
# shared connector code (.github/scripts/connector_notes.py).
#   1. Run this workflow on main and pick the package. It opens a release PR that sets the version
#      and shows the notes.
#   2. Merge the release PR. The rest runs in this workflow, one job after the other:
#        release: for every package whose version the PR changed, builds and smoke-tests the wheel
#          and the sdist, tags <package>-vX.Y.Z, and creates a GitHub release with the two files
#          attached.
#        publish-testpypi: waits for approval in the pypi environment, then uploads those files.
#        publish-pypi: waits for approval too, then uploads the same files.
#        next-development-version: opens a PR that moves the released packages to their next
#          development version, X.(Y+1).0.dev0. Merge it.
#      The publish jobs upload the files the release holds. They do not build.
# Releasing both raises the masquare-timenet floor of masquare-timenet-connectors to the new masquare-timenet version.
# Releasing one package alone keeps the floor. The release PR warns when the other package has
# changes that the release leaves out.
# The version is fixed when the release PR opens. If main gets changes that need a bigger bump
# before you merge it, close the release PR and run this workflow again.
# Every job can be re-run: steps that already happened are skipped, and an upload skips the files
# the index already has.
# Only admins and maintainers can start a release, merge the release PR, or re-run a job. If
# someone else merges the release PR, nothing is tagged until an admin or maintainer re-runs it.
#
# Needs a GitHub App with contents and pull-requests write access, installed on this repository,
# with its id in the RELEASE_APP_ID variable and its key in the RELEASE_APP_PRIVATE_KEY secret.
# PRs opened with GITHUB_TOKEN are blocked by the repository settings and would not run CI.

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to release
        required: true
        default: both
        type: choice
        options:
          - both
          - masquare-timenet
          - masquare-timenet-connectors
      version:
        description: Version to release, for example 0.12.0. Leave empty to compute it from the commits.
        required: false
        type: string
  push:
    branches: [main]

permissions:
  contents: read

env:
  GIT_CLIFF: git-cliff==2.14.2
  GH_REPO: ${{ github.repository }}

jobs:
  authorize:
    if: >-
      github.event_name == 'workflow_dispatch'
      || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(release):'))
    runs-on: ubuntu-latest
    steps:
      - name: Allow only admins and maintainers
        env:
          GH_TOKEN: ${{ github.token }}
          # The user who started the run, pushed the merged release PR, or re-ran a job.
          ACTOR: ${{ github.triggering_actor }}
        run: |
          role=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq .role_name)
          if [ "$role" != admin ] && [ "$role" != maintain ]; then
            echo "::error title=Not allowed::$ACTOR has the $role role. Only admins and maintainers can release."
            exit 1
          fi

  prepare:
    needs: authorize
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Guard to main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error title=Invalid branch::Start a release from main."
          exit 1
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Set the versions and write the notes
        id: versions
        env:
          PACKAGE: ${{ inputs.package }}
          REQUESTED: ${{ inputs.version }}
        run: |
          # The legacy vX.Y.Z tags count as the last release of both packages.
          cliff() {
            local package=$1; shift
            uvx "$GIT_CLIFF" --include-path "packages/${package#masquare-}/**" \
              --tag-pattern "^($package-)?v[0-9]+\.[0-9]+\.[0-9]+$" "$@"
          }
          if [ "$PACKAGE" = both ]; then packages="masquare-timenet masquare-timenet-connectors"; else packages=$PACKAGE; fi
          titles=() tags=()
          : > "$RUNNER_TEMP/notes.md"
          for package in $packages; do
            version=${REQUESTED:-$(cliff "$package" --bumped-version)}
            version=${version##*v}
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error title=Invalid version::'$version' is not X.Y.Z."
              exit 1
            fi
            for tag in "$package-v$version" "v$version"; do
              if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
                echo "::error title=Version exists::Tag $tag already exists. Is $package unchanged since then?"
                exit 1
              fi
            done
            uv version --package "$package" "$version" --frozen
            {
              echo "## $package $version"
              echo
              if [ "$package" = masquare-timenet-connectors ]; then
                last=$(git describe --tags --abbrev=0 --match "$package-v*" --match 'v*')
                uv run --no-project .github/scripts/connector_notes.py "$last" HEAD --release "$package-v$version"
              else
                cliff "$package" --unreleased --tag "$package-v$version" --strip header
              fi
              echo
            } >> "$RUNNER_TEMP/notes.md"
            titles+=("$package $version")
            tags+=("$package-v$version")
          done
          connectors=packages/timenet-connectors/pyproject.toml
          if [ "$PACKAGE" = both ]; then
            # Connectors needs the masquare-timenet release that ships with it.
            timenet_version=$(uv version --package masquare-timenet --short)
            sed -i -E "s/\"masquare-timenet\[build\]>=[^\"]*\"/\"masquare-timenet[build]>=$timenet_version\"/" "$connectors"
            grep -q "\"masquare-timenet\[build\]>=$timenet_version\"" "$connectors"
          else
            # Warn when the other package has changes this release leaves out. Skip the commits
            # cliff.toml skips too: release and development-version commits.
            if [ "$PACKAGE" = masquare-timenet ]; then other=masquare-timenet-connectors; else other=masquare-timenet; fi
            last=$(git describe --tags --abbrev=0 --match "$other-v*" --match 'v*')
            unreleased=$(git log --format=%s "$last..HEAD" -- "packages/${other#masquare-}" \
              | grep -cvE '^chore(\(release\)|: start .* development)' || true)
            if [ "$unreleased" -gt 0 ]; then
              floor=$(grep -o '"masquare-timenet\[build\]>=[^"]*"' "$connectors")
              {
                echo "> [!WARNING]"
                echo "> $other has $unreleased commits since $last that this release leaves out, and"
                echo "> masquare-timenet-connectors keeps $floor. If those commits go with the $PACKAGE changes,"
                echo "> release both instead."
                echo
              } >> "$RUNNER_TEMP/notes.md"
            fi
          fi
          uv lock
          title="chore(release): $(IFS=,; echo "${titles[*]}" | sed 's/,/, /g')"
          branch="release/$(IFS=-; echo "${tags[*]}")"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Open the release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TITLE: ${{ steps.versions.outputs.title }}
          BRANCH: ${{ steps.versions.outputs.branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -am "$TITLE"
          git push --force origin "$BRANCH"
          {
            echo "Merging this PR tags each package below and creates its GitHub release with these notes."
            echo "The same run then waits for your approval to upload to TestPyPI, and again for PyPI."
            echo "To change the notes, edit them in the GitHub release after it is created."
            echo
            echo "---"
            echo
            cat "$RUNNER_TEMP/notes.md"
          } > "$RUNNER_TEMP/body.md"
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/body.md"
          fi

  release:
    needs: authorize
    if: >-
      github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.released.outputs.released }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Find the packages this PR released
        id: released
        run: |
          released=()
          for package in masquare-timenet masquare-timenet-connectors; do
            version=$(uv version --package "$package" --short)
            before=$(git show "HEAD^:packages/${package#masquare-}/pyproject.toml" | sed -n -E 's/^version = "(.*)"$/\1/p')
            if [ "$version" = "$before" ]; then continue; fi
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error title=Invalid version::$package is at $version, not X.Y.Z."
              exit 1
            fi
            released+=("$package=$version")
          done
          if [ ${#released[@]} -eq 0 ]; then
            echo "::error title=Nothing to release::This PR changed no package version."
            exit 1
          fi
          echo "released=${released[*]}" >> "$GITHUB_OUTPUT"
      - name: Build
        # build_dists.py records the commit inside each package, so a build can name its code.
        env:
          RELEASED: ${{ steps.released.outputs.released }}
        run: |
          for entry in $RELEASED; do
            uv run scripts/build_dists.py --package "${entry%=*}"
          done
      - name: Smoke test built artifacts
        # Import each built wheel and sdist in an isolated environment to catch missing files or
        # broken metadata before uploading. Each artifact must also report this commit, clean, as
        # the code it was built from. masquare-timenet-connectors depends on masquare-timenet, so hand it the
        # wheel we just built when it is present (a `both` run); otherwise masquare-timenet resolves from the
        # default index, which requires it to be published already.
        run: |
          set -euo pipefail
          if curl -sfo /dev/null https://test.pypi.org/simple/masquare-timenet/; then export UV_FIND_LINKS=https://test.pypi.org/simple/masquare-timenet/; fi
          shopt -s nullglob
          timenet_whl=(dist/masquare_timenet-*.whl)
          # The merge commit that the tags point at.
          expected_sha=$(git rev-parse HEAD)
          smoke() {
            local module="$1" dist="$2"; shift 2
            local args=() artifact
            for artifact in "$@"; do args+=(--with "$artifact"); done
            echo "::group::import $module"
            uv run --isolated --no-project "${args[@]}" \
              python -c "import $module; print('smoke ok:', $module.__name__)"
            uv run --isolated --no-project "${args[@]}" python -c "
          from timenet.manifest import GitSource
          from timenet.provenance import PackageSnapshot
          commit = PackageSnapshot.read('$dist').source
          expected = GitSource(sha='$expected_sha', contains_local_changes=False)
          assert commit == expected, f'$dist records {commit}, expected {expected}'
          print('commit ok:', commit)"
            echo "::endgroup::"
          }
          for artifact in dist/*; do
            case "$artifact" in
              dist/masquare_timenet-*.whl | dist/masquare_timenet-*.tar.gz)
                smoke timenet masquare-timenet "$artifact" ;;
              dist/masquare_timenet_connectors-*.whl | dist/masquare_timenet_connectors-*.tar.gz)
                smoke timenet_connectors masquare-timenet-connectors ${timenet_whl[@]+"${timenet_whl[@]}"} "$artifact" ;;
            esac
          done
      - name: Tag and create the GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASED: ${{ steps.released.outputs.released }}
        run: |
          cliff() {
            local package=$1; shift
            uvx "$GIT_CLIFF" --include-path "packages/${package#masquare-}/**" \
              --tag-pattern "^($package-)?v[0-9]+\.[0-9]+\.[0-9]+$" "$@"
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for entry in $RELEASED; do
            package=${entry%=*} version=${entry#*=}
            tag="$package-v$version"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              # A re-run: the tag is already pushed. It must point at this release.
              if [ "$(git rev-parse "$tag^{commit}")" != "$(git rev-parse HEAD)" ]; then
                echo "::error title=Tag mismatch::$tag exists on another commit."
                exit 1
              fi
            else
              git tag -a "$tag" -m "$package $version"
              git push origin "$tag"
            fi
            if ! gh release view "$tag" >/dev/null 2>&1; then
              if [ "$package" = masquare-timenet-connectors ]; then
                # The new tag is on HEAD, so the last release is the newest tag before it.
                last=$(git describe --tags --abbrev=0 --match "$package-v*" --match 'v*' HEAD^)
                uv run --no-project .github/scripts/connector_notes.py "$last" HEAD --release "$tag" > "$RUNNER_TEMP/notes.md"
              else
                cliff "$package" --latest --strip header --output "$RUNNER_TEMP/notes.md"
              fi
              gh release create "$tag" --verify-tag --title "$package $version" --notes-file "$RUNNER_TEMP/notes.md"
            fi
            # Attach the wheel and the sdist. A re-run uploads only the files that are missing, so
            # the files a publish run may already have taken stay as they are.
            attached=$(gh release view "$tag" --json assets --jq '.assets[].name')
            for file in "dist/${package//-/_}-$version"-*.whl "dist/${package//-/_}-$version".tar.gz; do
              if ! grep -qxF "$(basename "$file")" <<< "$attached"; then
                gh release upload "$tag" "$file"
              fi
            done
          done

  publish-testpypi:
    # Waits for approval in the pypi environment. Downloads the files the release job attached, so nothing is built here.
    needs: release
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      # Mint the OIDC token uv exchanges for a trusted-publishing token. No API tokens are stored.
      id-token: write
      contents: read
    steps:
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Download the release files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASED: ${{ needs.release.outputs.released }}
        run: |
          expected=()
          for entry in $RELEASED; do
            package=${entry%=*} version=${entry#*=}
            gh release download "$package-v$version" --dir dist
            expected+=("${package//-/_}-$version-py3-none-any.whl" "${package//-/_}-$version.tar.gz")
          done
          if [ "$(ls dist | sort)" != "$(printf '%s\n' "${expected[@]}" | sort)" ]; then
            echo "::error title=Unexpected files::The releases hold $(ls dist | xargs), expected ${expected[*]}."
            exit 1
          fi
          ls -l dist
      - name: Publish to TestPyPI
        # --check-url skips files the index already has, so a re-run after a partial upload resumes.
        run: uv publish --publish-url https://test.pypi.org/legacy/ --check-url https://test.pypi.org/simple/ dist/*
      - name: Summary
        run: |
          for whl in dist/*.whl; do
            base=$(basename "$whl")
            project=${base%%-*}
            project=${project//_/-}
            rest=${base#*-}
            echo "- \`$project\` ${rest%%-*} on TestPyPI: https://test.pypi.org/project/$project/${rest%%-*}/"
          done >> "$GITHUB_STEP_SUMMARY"

  publish-pypi:
    # Starts only after TestPyPI took the same files, and waits for approval in the pypi environment too.
    needs: [release, publish-testpypi]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      # Mint the OIDC token uv exchanges for a trusted-publishing token. No API tokens are stored.
      id-token: write
      contents: read
    steps:
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Download the release files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASED: ${{ needs.release.outputs.released }}
        run: |
          expected=()
          for entry in $RELEASED; do
            package=${entry%=*} version=${entry#*=}
            gh release download "$package-v$version" --dir dist
            expected+=("${package//-/_}-$version-py3-none-any.whl" "${package//-/_}-$version.tar.gz")
          done
          if [ "$(ls dist | sort)" != "$(printf '%s\n' "${expected[@]}" | sort)" ]; then
            echo "::error title=Unexpected files::The releases hold $(ls dist | xargs), expected ${expected[*]}."
            exit 1
          fi
          ls -l dist
      - name: Publish to PyPI
        # --check-url skips files the index already has, so a re-run after a partial upload resumes.
        run: echo "sandbox PyPI upload skipped"
      - name: Summary
        run: |
          for whl in dist/*.whl; do
            base=$(basename "$whl")
            project=${base%%-*}
            project=${project//_/-}
            rest=${base#*-}
            echo "- \`$project\` ${rest%%-*} on PyPI: https://pypi.org/project/$project/${rest%%-*}/"
          done >> "$GITHUB_STEP_SUMMARY"

  next-development-version:
    # Runs after the PyPI upload only. It is its own job, so the App key never shares a runner
    # with the OIDC token that uploads to PyPI.
    needs: [release, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Open the development version PR
        # Only a package that main still holds at the released version moves on. So a re-run after
        # the PR was merged changes nothing.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASED: ${{ needs.release.outputs.released }}
        run: |
          names=()
          tags=()
          for entry in $RELEASED; do
            package=${entry%=*}
            version=${entry#*=}
            if [ "$(uv version --package "$package" --short)" != "$version" ]; then
              echo "main already moved $package past $version."
              continue
            fi
            uv version --package "$package" --bump minor --bump dev=0 --frozen
            next=$(uv version --package "$package" --short)
            names+=("$package ${next%.dev0}")
            tags+=("$package-v$version")
          done
          if [ ${#names[@]} -eq 0 ]; then exit 0; fi
          uv lock
          title="chore: start $(IFS=,; echo "${names[*]}" | sed 's/,/ and /g') development"
          branch="chore/start-development-after-$(IFS=-; echo "${tags[*]}")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "$title"
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$branch" --title "$title" \
              --body "Moves the released packages to their next development version ($RELEASED released to PyPI), so builds from main are not mistaken for a release."
          fi
