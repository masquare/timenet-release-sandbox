name: Publish to PyPI

# Uploads the wheel and the sdist that release.yml built and attached to the GitHub release of a
# <package>-vX.Y.Z tag. It does not build. release.yml starts the TestPyPI run, and a successful
# TestPyPI run starts the PyPI run of the same tag. After a PyPI upload, it opens the PR that moves
# main to the next development version.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Index to publish to
        required: true
        default: TestPyPI
        type: choice
        options:
          - TestPyPI
          - PyPI
      package:
        description: Package(s) to publish
        required: true
        default: both
        type: choice
        options:
          - both
          - masquare-timenet
          - masquare-timenet-connectors
      ref:
        description: Release tag to publish, for example masquare-timenet-v0.12.0
        required: true
        type: string

run-name: Publish ${{ inputs.package }} ${{ inputs.ref }} to ${{ inputs.target }}

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.download.outputs.released }}
    # The `pypi` environment gates every run behind its required reviewers, so a publish only
    # proceeds once one of the listed admins approves it, even though workflow_dispatch is offered
    # to anyone with write access. Configure the reviewers in Settings > Environments > pypi.
    environment:
      name: pypi
    permissions:
      # Mint the OIDC token uv exchanges for a PyPI/TestPyPI trusted-publishing token. No API
      # tokens are stored as repo secrets.
      id-token: write
      contents: read
      # Start the PyPI run after a TestPyPI run.
      actions: write
    steps:
      - name: Guard to main
        run: |
          echo "Branch: $BRANCH_NAME"
          if [ "$BRANCH_NAME" != "main" ]; then
            echo "::error title=Invalid branch::Run publish.yml from main."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Guard the release tag
        env:
          REF: ${{ inputs.ref }}
        run: |
          if ! [[ "$REF" =~ ^(masquare-timenet|masquare-timenet-connectors)-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error title=Invalid ref::Publish only a <package>-vX.Y.Z tag on main, not '$REF'."
            exit 1
          fi
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
      - name: Download the release files
        id: download
        # Each published package needs its own tag on this commit, and the files its GitHub
        # release holds: one wheel and one sdist at the tagged version, nothing else.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE: ${{ inputs.package }}
        run: |
          if [ "$PACKAGE" = both ]; then packages="masquare-timenet masquare-timenet-connectors"; else packages=$PACKAGE; fi
          expected=()
          released=()
          for package in $packages; do
            version=$(uv version --package "$package" --short)
            tag="$package-v$version"
            if [ "$(git rev-parse -q --verify "refs/tags/$tag^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "::error title=Not released::$package is at $version, but $tag does not point at this commit. Release it first."
              exit 1
            fi
            gh release download "$tag" --dir dist
            expected+=("${package//-/_}-$version-py3-none-any.whl" "${package//-/_}-$version.tar.gz")
            released+=("$package=$version")
          done
          echo "released=${released[*]}" >> "$GITHUB_OUTPUT"
          if [ "$(ls dist | sort)" != "$(printf '%s\n' "${expected[@]}" | sort)" ]; then
            echo "::error title=Unexpected files::The releases hold $(ls dist | xargs), expected ${expected[*]}."
            exit 1
          fi
          ls -l dist
      - name: Publish
        run: |
          if [ "${{ inputs.target }}" = "TestPyPI" ]; then
            uv publish --publish-url https://test.pypi.org/legacy/ dist/*
          else
            echo "sandbox: PyPI upload skipped"
          fi
      - name: Start the PyPI run
        # A TestPyPI run starts the PyPI run of the same tag, which waits for approval. So PyPI
        # can only be approved after TestPyPI took the same files.
        if: inputs.target == 'TestPyPI'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE: ${{ inputs.package }}
          REF: ${{ inputs.ref }}
        run: |
          name="Publish $PACKAGE $REF to PyPI"
          if gh run list --workflow publish.yml --event workflow_dispatch --limit 100 --json displayTitle \
              --jq '.[].displayTitle' | grep -qxF "$name"; then
            echo "Skipping '$name': it was already started."
            exit 0
          fi
          gh workflow run publish.yml --ref main -f target=PyPI -f package="$PACKAGE" -f ref="$REF"
      - name: Summary
        if: success()
        run: |
          host=pypi.org
          if [ "${{ inputs.target }}" = "TestPyPI" ]; then host=test.pypi.org; fi
          {
            echo "### Published to ${{ inputs.target }} :rocket:"
            echo
            for whl in dist/*.whl; do
              base=$(basename "$whl")
              dist_name=${base%%-*}
              rest=${base#*-}
              version=${rest%%-*}
              project=${dist_name//_/-}
              echo "- \`$project\` $version — https://$host/project/$project/$version/"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  next-development-version:
    # Runs after the PyPI upload only. It is its own job, so the App key never shares a runner
    # with the OIDC token that uploads to PyPI.
    needs: publish
    if: inputs.target == 'PyPI'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v5
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
      - uses: astral-sh/setup-uv@v7
      - name: Open the development version PR
        # Only a package that main still holds at the released version moves on. So a re-run after
        # the PR was merged changes nothing.
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASED: ${{ needs.publish.outputs.released }}
        run: |
          names=()
          tags=()
          for entry in $RELEASED; do
            package=${entry%=*}
            version=${entry#*=}
            if [ "$(uv version --package "$package" --short)" != "$version" ]; then
              echo "main already moved $package past $version."
              continue
            fi
            uv version --package "$package" --bump minor --bump dev=0 --frozen
            next=$(uv version --package "$package" --short)
            names+=("$package ${next%.dev0}")
            tags+=("$package-v$version")
          done
          if [ ${#names[@]} -eq 0 ]; then exit 0; fi
          uv lock
          title="chore: start $(IFS=,; echo "${names[*]}" | sed 's/,/ and /g') development"
          branch="chore/start-development-after-$(IFS=-; echo "${tags[*]}")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "$title"
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$branch" --title "$title" \
              --body "Moves the released packages to their next development version ($RELEASED released to PyPI), so builds from main are not mistaken for a release."
          fi
